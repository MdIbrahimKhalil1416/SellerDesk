# Render Blueprint: SellerDesk as ONE web service (backend + built frontend in one Docker image).
# Optional: docs/DEPLOYMENT.md creates the same service by hand in the dashboard.
# Secrets are NOT stored here: every `sync: false` value is typed into the Render dashboard.
# Spec: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sellerdesk
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore # closest Render region to Bangladesh
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_URL
        sync: false # e.g. https://sellerdesk.onrender.com (no trailing slash)
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: sellerdesk
      - key: JWT_SECRET
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
