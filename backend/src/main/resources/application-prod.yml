# Production. Activate with environment variable SPRING_PROFILES_ACTIVE=prod.
# All secrets must be real environment variables on the server (no .env file).

spring:
  mail:
    # No empty defaults in prod: the app refuses to start if these are missing.
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        # Only /actuator/health is reachable over HTTP (SecurityConfig also denies /actuator/**).
        # Public on purpose: Render's health check and UptimeRobot call it without a token.
        include: health
  endpoint:
    health:
      # Public response is just {"status":"UP"} (or DOWN + 503): no database names, disk space,
      # versions or group names.
      show-details: never
      show-components: never
      # No liveness/readiness groups: they are for Kubernetes, and would add "groups" to the output.
      probes:
        enabled: false

server:
  # Render's proxy terminates HTTPS and forwards the request over HTTP with X-Forwarded-* headers.
  # This makes the app see the original scheme/host/client IP (needed for correct https URLs and,
  # later, per-IP rate limiting). Safe only behind a proxy that sets these headers itself.
  forward-headers-strategy: native

# API docs and Swagger UI are switched off in production (the URLs answer 404).
# Why: a public map of every endpoint and DTO helps attackers more than it helps us; the frontend
# does not need it; and the "Try it out" button would be a second, unprotected client on the live
# system. Developers use Swagger locally (dev profile). See docs/DEPLOYMENT.md.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

sellerdesk:
  # No default: without CLOUDINARY_URL the app refuses to start.
  cloudinary:
    url: ${CLOUDINARY_URL}
    required: true
  courier:
    # A real courier (later) needs COURIER_WEBHOOK_SECRET: the app refuses to start without it.
    webhook-secret-required: true
    mock:
      # No pretend courier in production.
      enabled: false
  refresh-cookie:
    # One service serves the app and the API, so the cookie is first-party. See docs/SECURITY.md §2.
    same-site: Strict
    secure: true

logging:
  level:
    root: INFO
    com.sellerdesk: INFO
