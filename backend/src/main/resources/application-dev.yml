# Local development. Active by default (spring.profiles.default=dev).

management:
  endpoint:
    health:
      # Shows MongoDB status in /actuator/health so you can see if Atlas is reachable.
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

sellerdesk:
  refresh-cookie:
    # localhost:5173 -> localhost:8080 is the same site; plain http cannot use Secure cookies.
    same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    secure: ${REFRESH_COOKIE_SECURE:false}

logging:
  level:
    com.sellerdesk: DEBUG
