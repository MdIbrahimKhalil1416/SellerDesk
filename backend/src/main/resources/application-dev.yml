# Local development. Active by default (spring.profiles.default=dev).

management:
  endpoint:
    health:
      # Shows MongoDB status in /actuator/health so you can see if Atlas is reachable.
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

sellerdesk:
  # The browser opens the Vite dev server, which proxies /api to this backend: one origin.
  # Not a secret, so a default is fine here. Override with APP_URL if you use another port.
  app-url: ${APP_URL:http://localhost:5173}
  refresh-cookie:
    # Plain http on localhost cannot use Secure cookies.
    same-site: Strict
    secure: false

logging:
  level:
    com.sellerdesk: DEBUG
