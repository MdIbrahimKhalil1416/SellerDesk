# Used by tests annotated with @ActiveProfiles("test"). Dummy values only, no real secrets.

spring:
  mongodb:
    # Overridden by Testcontainers (@ServiceConnection) in tests that start a real MongoDB.
    # Short timeouts so tests without a database don't hang.
    uri: mongodb://localhost:27017/sellerdesk-test?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000
  data:
    mongodb:
      # Index creation at startup needs a running MongoDB. Tests without a database would fail
      # to start, so it is off here and switched back on by tests that use Testcontainers.
      auto-index-creation: false

sellerdesk:
  app-url: http://localhost:5173
  jwt:
    secret: test-only-secret-test-only-secret-0123456789
  # Dummy value: creating the Cloudinary client makes no network call. Integration tests replace
  # the storage with FakeImageStorage anyway.
  cloudinary:
    url: cloudinary://000000000000000:test-only-secret@test-cloud
