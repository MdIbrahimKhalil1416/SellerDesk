name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Committed from Windows, so the executable bit may be missing.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Build only: compiles and packages the jar, tests are skipped.
      # Run tests locally with: ./mvnw test
      - name: Build
        run: ./mvnw -B --no-transfer-progress -DskipTests package
