name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Committed from Windows, so the executable bit may be missing.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # No secrets needed: tests use dummy values from application-test.yml, MONGODB_TEST_URI is
      # not set, so integration tests use Testcontainers (Docker is preinstalled on ubuntu runners).
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
