name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Committed from Windows, so the executable bit may be missing.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Build only: compiles and packages the jar, tests are skipped.
      # Run tests locally with: ./mvnw test
      - name: Build
        run: ./mvnw -B --no-transfer-progress -DskipTests package

  # Builds the same image Render builds from backend/Dockerfile, so a broken Dockerfile fails here
  # first. Runs only after the job above succeeded. The image is NOT pushed anywhere.
  docker-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: sellerdesk-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image runs as a non-root user and contains a Java 21 runtime.
      - name: Check image
        run: |
          user=$(docker image inspect sellerdesk-backend:ci --format '{{.Config.User}}')
          echo "Image user: $user"
          test -n "$user" && test "$user" != "root"
          version=$(docker run --rm --entrypoint java sellerdesk-backend:ci -version 2>&1)
          echo "$version"
          echo "$version" | grep -q 'version "21'
